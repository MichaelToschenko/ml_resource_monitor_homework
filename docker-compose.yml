services:
  # Демо: тексты, модель, эмбеддинги, а в конце утечка памяти, пока Docker не убьёт контейнер
  demo:
    image: mikhailtoshchenko/resmon:latest
    command: ["demo", "--log", "logs/demo.jsonl", "--leak-mb", "5000"]
    init: true  # Ctrl+C даёт обычную остановку, тогда код 137 значит только нехватку памяти
    mem_limit: 3g
    memswap_limit: 3g  # без свопа, иначе вместо падения контейнер просто будет тормозить
    volumes:
      - logs:/app/logs

  # Живой дашборд на http://localhost:8501, читает тот же лог
  dashboard:
    image: mikhailtoshchenko/resmon:latest
    command: ["dashboard", "--log", "logs/demo.jsonl"]
    init: true
    ports:
      - "8501:8501"
    volumes:
      - logs:/app/logs

volumes:
  logs:
