[project]
name = "resmon"
version = "0.1.0"
description = "Монитор ресурсов для ML-задач: CPU, RAM, GPU, диск, память Python и сборщик мусора по секциям кода"
readme = "README.md"
authors = [{ name = "Mikhail Toshchenko" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.29.0",
    "numpy>=2.5.5",
    "psutil>=7.2.2",
    "typer>=0.29.3",
]

[project.scripts]
resmon = "resmon.cli:app"

[project.optional-dependencies]
ui = [
    "plotly>=7.2.0",
    "streamlit>=1.67.0",
]
gpu = [
    "nvidia-ml-py>=13.615.71",
]
demo = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-psutil>=7.2.2.20261122",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "T20"]
# Кириллица в строках и комментариях похожа на латиницу, ruff зря на неё ругается
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests", "research.py"]

[[tool.mypy.overrides]]
# У pynvml и plotly нет описаний типов
module = ["pynvml", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --cov=resmon --cov-report=term-missing --cov-fail-under=70"
markers = ["slow: тесты с настоящей моделью, в CI не запускаются"]
