name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш отменяет старый прогон, чтобы latest на Docker Hub не перезаписался старым образом
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Токену GitHub хватит чтения кода, на Docker Hub пускают свои секреты
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.28"  # та же версия, что в Dockerfile
      - name: Зависимости строго по uv.lock
        run: uv sync --locked --all-extras
      - name: Ruff, mypy и остальные хуки pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Тесты с покрытием, медленные с настоящей моделью пропускаем
        run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # QEMU нужен, чтобы на обычной машине собрать образ и под arm64
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Сборка, а на main ещё и выкладка на Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            mikhailtoshchenko/resmon:latest
            mikhailtoshchenko/resmon:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
